[project]
name = "uk-jobs-neet"
version = "0.1.0"
description = "AI/automation exposure across UK occupations, scoped to entry-level roles for under-25s / the NEET population. UK adaptation of karpathy/jobs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "openpyxl>=3.1",
    "playwright>=1.44",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "xlrd>=2.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
